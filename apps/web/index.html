    <style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1c1f24}main{max-width:480px;margin:48px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px #0002}.button{display:inline-block;margin:8px 8px 8px 0;padding:10px 16px;border-radius:8px;background:#1a56db;color:#fff;text-decoration:none}.button.secondary{background:#eef2ff;color:#1a56db}.attach{margin:16px 0;padding-top:8px;border-top:1px solid #ddd}.attach-list{padding-left:18px}.attach-list [role=alert]{color:#b42318}.attach-actions label{cursor:pointer}.attach-actions label:focus-within{outline:3px solid #1a56db;outline-offset:2px}.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}button{padding:8px 14px;border-radius:8px;border:1px solid #bbb;background:#fff}.records{list-style:none;padding:0}.records li{margin:6px 0}.row{width:100%;text-align:left;min-height:44px}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;border:1px solid}.badge.ok{background:#e6f4ea;color:#14532d;border-color:#14532d}.badge.info{background:#eef2ff;color:#1e3a8a;border-color:#1e3a8a}.badge.wait{background:#fff7e0;color:#7a4b00;border-color:#7a4b00}.badge.warn{background:#fff1e6;color:#9a3412;border-color:#9a3412}.badge.bad{background:#fde8e8;color:#8a1c14;border-color:#8a1c14}[data-testid=pipeline]{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}[data-testid=pipeline] dd{margin:0}.who{font-weight:600}.modes{display:flex;gap:8px;margin:8px 0}.modes [aria-pressed=true]{background:#1a56db;color:#fff;border-color:#1a56db}.cal-nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.cal-nav button{min-width:44px;min-height:44px}.cal{width:100%;border-collapse:collapse;table-layout:fixed}.cal th{font-weight:600;padding:4px 0;font-size:.85em}.cal td{padding:2px}.day{width:100%;min-height:52px;padding:2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-color:#ddd}.day small{font-size:.65em;line-height:1.1;word-break:keep-all}.day.has{font-weight:600}.day.ok{background:#e6f4ea;border-color:#14532d}.day.info{background:#eef2ff;border-color:#1e3a8a}.day.wait{background:#fff7e0;border-color:#7a4b00}.day.warn{background:#fff1e6;border-color:#9a3412}.day.bad{background:#fde8e8;border-color:#8a1c14}.interview{margin:16px 0;padding-top:8px;border-top:1px solid #ddd}.iv-status{font-weight:700;font-size:1.1em}.mic{color:#4b5563}.mic.on{color:#b42318;font-weight:700}.meta{color:#4b5563;font-size:.9em}.iv-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.iv-actions button,.iv-actions .button{min-height:48px;min-width:48px;font-size:1em}.iv-actions button:focus-visible,.interview button:focus-visible,.interview textarea:focus-visible{outline:3px solid #1a56db;outline-offset:2px}.problem{border:2px solid #9a3412;background:#fff1e6;border-radius:8px;padding:8px 12px;margin:12px 0}.banner{background:#fff7e0;border:1px solid #7a4b00;border-radius:8px;padding:6px 10px}.notice{color:#7a4b00}.conv{padding-left:0;list-style:none}.conv li{margin:6px 0;padding:6px 10px;border-radius:8px;background:#f1f3f6}.conv li[data-kind=QUESTION]{background:#eef2ff}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}[role=alertdialog]{display:block;margin:8px 0;padding:8px 12px;border:2px solid #9a3412;background:#fff1e6;border-radius:8px}[role=alertdialog] button{min-height:44px;margin:4px 8px 4px 0}.danger{background:#8a1c14;color:#fff;border-color:#8a1c14}[data-testid=retention-note],[data-testid=trash-note]{background:#eef2ff;border-left:4px solid #1e3a8a;padding:6px 10px}[data-testid=trash-done]{background:#e6f4ea;border-left:4px solid #14532d;padding:6px 10px}[data-testid=screen-trash] button,[data-testid=screen-record-detail] button{min-height:44px}[data-testid=screen-trash] button:focus-visible,[data-testid=screen-record-detail] button:focus-visible{outline:3px solid #1a56db;outline-offset:2px}</style></head>
