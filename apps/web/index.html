<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Daily Log</title>
    <style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1c1f24}main{max-width:480px;margin:48px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px #0002}.button{display:inline-block;margin:8px 8px 8px 0;padding:10px 16px;border-radius:8px;background:#1a56db;color:#fff;text-decoration:none}.button.secondary{background:#eef2ff;color:#1a56db}.attach{margin:16px 0;padding-top:8px;border-top:1px solid #ddd}.attach-list{padding-left:18px}.attach-list [role=alert]{color:#b42318}.attach-actions label{cursor:pointer}.attach-actions label:focus-within{outline:3px solid #1a56db;outline-offset:2px}.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}button{padding:8px 14px;border-radius:8px;border:1px solid #bbb;background:#fff}.records{list-style:none;padding:0}.records li{margin:6px 0}.row{width:100%;text-align:left;min-height:44px}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;border:1px solid}.badge.ok{background:#e6f4ea;color:#14532d;border-color:#14532d}.badge.info{background:#eef2ff;color:#1e3a8a;border-color:#1e3a8a}.badge.wait{background:#fff7e0;color:#7a4b00;border-color:#7a4b00}.badge.bad{background:#fde8e8;color:#8a1c14;border-color:#8a1c14}[data-testid=pipeline]{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}[data-testid=pipeline] dd{margin:0}.who{font-weight:600}</style></head>
